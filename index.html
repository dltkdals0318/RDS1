<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Zipper</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://o6cdhdutve.execute-api.ap-northeast-2.amazonaws.com">
    <link rel="stylesheet" href="https://o6cdhdutve.execute-api.ap-northeast-2.amazonaws.com/v1/api/css/drop_fontstream_css/?sid=gAAAAABqFFYGV27VlCUQHfje8jFGgE6IS2uEVi4cJoYmeqAgZYIynOwPVwM5QP30WsUVo_W3Bl6REyVyy2-lXe3tI0hY987WHC6kIH6HWnEyLfZjIYs0Mpr1lgs9i-51Zs3LFMSqYgchdGR9xJip89QKb7tNaMjgpiCapq8Uw_FeF1lM3KL2WkIKcYqrxuYuJUtsLfZQ6_x1XDJpTDWT7LMt3wbxdZ5Jz1xlWxraTZX_xW3DULXpV5NOPM3ImOF1V05OeMglkldz" charset="utf-8" referrerpolicy="origin"></link>
    <link rel="stylesheet" href="css/clash-display.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- loading screen -->
    <div id="loading-screen" role="status" aria-label="콘텐츠 로딩 중">
      <div class="loading-card">
        <h1 class="loading-title title">Time Zipper</h1>
        <p class="loading-how-label">카드를 좌우로 스와이프해서<br>아는 유행과 모르는 유행을 나눠보세요!</p>
        <input id="nickname-input" class="loading-enter" type="text" placeholder="(enter your nickname)" maxlength="20" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <!-- navigator -->
    <nav class="top-nav">
      <a href="#/" class="nav-logo title">Time Zipper</a>
      <div class="nav-right">
        <div id="nav-swipe">
          <button class="circle-btn how-to-play-btn" id="how-to-play-btn">?</button>
        </div>
      </div>
    </nav>

    <!-- swipe -->
    <section id="view-swipe" class="view">
      <div class="swipe-stage">
        <div class="swipe-side" id="side-dispose">
          <button class="swipe-side-btn" id="btn-dispose">I know</button>
          <div class="swipe-pile" id="pile-dispose"></div>
        </div>
        <div class="swipe-area">
          <div class="swipe-deck" id="swipe-deck"></div>
          <div class="swipe-labels" id="swipe-labels">
            <span class="swipe-label label-dispose" id="label-dispose">I know</span>
            <span class="swipe-label label-preserve" id="label-preserve">I don't know</span>
          </div>
        </div>
        <div class="swipe-side" id="side-preserve">
          <button class="swipe-side-btn" id="btn-preserve">I don't know</button>
          <div class="swipe-pile" id="pile-preserve"></div>
        </div>
      </div>
      <p class="swipe-counter" id="swipe-counter">
        <span class="counter-current" id="counter-current"></span>
        <span class="counter-sep">/</span>
        <span class="counter-total" id="counter-total"></span>
      </p>
    </section>


    <!-- archive -->
    <section id="view-archive" class="view" hidden>
      <div class="archive-header">
        <button class="circle-btn archive-info-btn" id="archive-info-btn" aria-label="한물감이란?">?</button>
        <a href="#/" class="archive-title title">Time Archive</a>
        <button class="circle-btn archive-save-btn" aria-label="나만의 타임캡슐 만들기">↓</button>
      </div>
      <section class="works">
        <div id="grid"></div>
      </section>
    </section>

    <!-- detail view -->
    <section id="view-detail" class="view" hidden>
      <div class="cert-wrap">
        <button class="cert-back" id="cert-back">← 뒤로</button>
        <article id="death-cert"></article>
      </div>
    </section>

    <script src="js/data.js" defer></script>
    <script src="js/trends.js" defer></script>
    <script src="js/init.js" defer></script>
    <script src="js/render.js" defer></script>
  </body>
</html>
